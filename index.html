*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    padding:18px 10px 50px;

.header{

    font-size:21px;
    font-weight:800;
}

.field{
    margin-bottom:17px;
    position:relative;
}

label{
    display:block;

    color:#91a8e9;

    font-weight:900;

}

input,select{
    width:100%;
    height:50px;
    padding:0 14px;
    border:1px solid #293b72;
    border-radius:11px;
    outline:none;
    background:#080f2b;
    color:#fff;
    font-family:Inter,sans-serif;
    font-size:14px;
    font-weight:700;
}

input::placeholder{
    color:#7f8ba9;
}

input:focus,select:focus{
    border-color:#527dff;
    box-shadow:0 0 0 3px rgba(82,125,255,.12);
}

select option{
    background:#080f2b;
    color:#fff;
}

/* ROLE */

.role-select{

}

.role-button{

    padding:0 14px;

    border:1px solid #293b72;
    border-radius:11px;
    background:#080f2b;
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.role-text{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.role-menu{
    display:none;
    position:absolute;
    z-index:100;
    top:57px;
    left:0;
    right:0;

    border:1px solid #30467e;
    border-radius:14px;
    background:#070d25;
    box-shadow:0 20px 50px rgba(0,0,0,.7);

.role-menu.open{

}

.role-option{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
    border-radius:8px;
    color:#fff;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
    text-transform:none;
    letter-spacing:0;
}

.role-option:hover{

}

.role-option input{
    width:18px;
    height:18px;

/* COUNTRY */

.country-select{
    position:relative;
}

.country-menu.open{

.country-search{

.country-list{

    overflow-y:auto;

.country-item{

    align-items:center;

    padding:11px;

    cursor:pointer;
    font-size:14px;
    font-weight:700;

.country-item:hover{

}

.country-flag{

.generate,.download{

.download{

.download.show{

    font-weight:900;

.preview-wrap{
    width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    border-radius:20px;

/* CARD */

#idCard{
    position:relative;
    width:1200px;
    height:800px;
    overflow:hidden;
    border-radius:35px;
    background:#05091c;
    color:#fff;
}

/*
 IMPORTANT:
 card-bg.png contains background + mascot.
 We use it as a controlled image layer instead of cover.
*/

#idCard::before{
    content:"";
    position:absolute;
    z-index:0;
    inset:0;

    background-image:url("card-bg.png");
    background-repeat:no-repeat;
    background-position:center center;

    /*
      This prevents mobile Generate preview
      from enlarging the image unexpectedly.
    */
    background-size:100% 100%;

    pointer-events:none;
}

/* OVERLAY */

#idCard::after{
    content:"";
    position:absolute;
    inset:0;
    z-index:1;

    background:
        linear-gradient(
            90deg,
            rgba(3,7,27,.86) 0%,
            rgba(3,7,27,.64) 38%,
            rgba(3,7,27,.20) 70%,
            rgba(3,7,27,.02) 100%

    pointer-events:none;
}

    z-index:3;
    left:70px;
    top:55px;

.brand-name{

.brand-sub{

.card-x{

.details{

.detail{

.detail-full{

/* =========================================================
   ID
========================================================= */

function createDliComId(){

    const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let id="DLC-";

    for(let i=0;i<6;i++){

        id +=
        chars[
            Math.floor(
                Math.random()*chars.length
            )
        ];

    }

    return id;
}

let dlicomId =
createDliComId();


/* =========================================================
   FLAG
========================================================= */

function flagEmoji(code){

    return code
    .toUpperCase()
    .replace(
        /./g,
        char =>
        String.fromCodePoint(
            127397 +
            char.charCodeAt(0)
        )
    );

}


/* =========================================================
   COUNTRY
========================================================= */

function renderCountries(search=""){

    countryList.innerHTML="";

    const query =
    search.toLowerCase().trim();

    const filtered =
    countries.filter(
        item =>
        item[1]
        .toLowerCase()
        .includes(query)
    );

    filtered.forEach(item=>{

        const div =
        document.createElement("div");

        div.className="country-item";

        div.innerHTML=`
            <span class="country-flag">
                ${flagEmoji(item[0])}
            </span>
            <span>${item[1]}</span>
        `;

        div.addEventListener(
            "click",
            ()=>{

                const flag =
                flagEmoji(item[0]);

                countryText.textContent =
                flag+" "+item[1];

                countryText.dataset.country =
                item[1];

                countryText.dataset.flag =
                flag;

                countryMenu
                .classList
                .remove("open");

                countrySearch.value="";

            }
        );

        countryList.appendChild(div);

    });


    const other =
    document.createElement("div");

    other.className="country-item";

    other.innerHTML=`
        <span class="country-flag">🌐</span>
        <span>Other</span>
    `;

    other.addEventListener(
        "click",
        ()=>{

            countryText.textContent =
            "🌐 Other";

            countryText.dataset.country =
            "Other";

            cou
