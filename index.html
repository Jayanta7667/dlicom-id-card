<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DliCOM Community ID</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

/* =========================
   BASIC
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    padding:20px 12px 50px;

    font-family:Inter,Arial,sans-serif;

    color:#fff;

    background:
        radial-gradient(
            circle at 50% 0%,
            #182d79 0%,
            #070d29 38%,
            #02030c 100%
        );
}

.container{
    width:100%;
    max-width:780px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:24px;
}

.header h1{
    font-family:"Space Grotesk",sans-serif;
    font-size:clamp(30px,6vw,46px);
    font-weight:800;
}

.header p{
    margin-top:7px;
    color:#9ba9cf;
    font-size:14px;
    font-weight:700;
}


/* =========================
   FORM
========================= */

.form-box{
    padding:20px;

    border-radius:20px;

    background:rgba(7,14,40,.95);

    border:1px solid rgba(86,121,255,.35);

    box-shadow:
        0 20px 60px rgba(0,0,0,.4);
}

.form-title{
    font-family:"Space Grotesk",sans-serif;

    font-size:20px;

    font-weight:800;

    margin-bottom:18px;
}

.field{
    margin-bottom:17px;

    position:relative;
}

label{
    display:block;

    margin-bottom:7px;

    color:#91a8e9;

    font-size:11px;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:.9px;
}

input,
select{
    width:100%;

    height:50px;

    padding:0 14px;

    border-radius:11px;

    border:1px solid #26396e;

    outline:none;

    background:#080f2b;

    color:#fff;

    font-family:Inter,sans-serif;

    font-size:14px;

    font-weight:800;
}

input::placeholder{
    color:#8793b2;

    font-weight:800;
}

input:focus,
select:focus{
    border-color:#507dff;

    box-shadow:
        0 0 0 3px rgba(80,125,255,.12);
}

select option{
    background:#080f2b;

    color:#fff;
}


/* =========================
   ROLE DROPDOWN
========================= */

.role-select{
    position:relative;
}

.role-button{
    width:100%;

    min-height:50px;

    padding:0 14px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    border-radius:11px;

    border:1px solid #26396e;

    background:#080f2b;

    color:#fff;

    font-family:Inter,sans-serif;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    text-align:left;
}

.role-button:hover{
    border-color:#507dff;
}

.role-text{
    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.role-menu{
    display:none;

    position:absolute;

    z-index:100;

    top:57px;

    left:0;

    right:0;

    max-height:330px;

    overflow-y:auto;

    padding:8px;

    border-radius:13px;

    background:#070d25;

    border:1px solid #30467e;

    box-shadow:
        0 20px 45px rgba(0,0,0,.65);
}

.role-menu.open{
    display:block;
}

.role-option{
    display:flex;

    align-items:center;

    gap:10px;

    padding:11px;

    border-radius:8px;

    color:#fff;

    cursor:pointer;

    font-size:14px;

    font-weight:800;
}

.role-option:hover{
    background:rgba(65,105,255,.16);
}

.role-option input{
    width:18px;

    height:18px;

    accent-color:#507dff;

    cursor:pointer;
}

.other-role{
    display:none;

    margin-top:9px;
}

.other-role.show{
    display:block;
}


/* =========================
   COUNTRY SEARCH DROPDOWN
========================= */

.country-select{
    position:relative;
}

.country-button{
    width:100%;

    min-height:50px;

    padding:0 14px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:10px;

    border-radius:11px;

    border:1px solid #26396e;

    background:#080f2b;

    color:#fff;

    font-family:Inter,sans-serif;

    font-size:14px;

    font-weight:800;

    cursor:pointer;

    text-align:left;
}

.country-button:hover{
    border-color:#507dff;
}

.country-text{
    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;
}

.country-menu{
    display:none;

    position:absolute;

    z-index:200;

    top:57px;

    left:0;

    right:0;

    padding:9px;

    border-radius:14px;

    background:#070d25;

    border:1px solid #30467e;

    box-shadow:
        0 20px 50px rgba(0,0,0,.7);
}

.country-menu.open{
    display:block;
}

.country-search{
    width:100%;

    height:45px;

    margin-bottom:8px;

    background:#080f2b;
}

.country-list{
    max-height:285px;

    overflow-y:auto;
}

.country-item{
    display:flex;

    align-items:center;

    gap:10px;

    width:100%;

    padding:11px;

    border-radius:8px;

    color:#fff;

    cursor:pointer;

    font-size:14px;

    font-weight:700;
}

.country-item:hover{
    background:rgba(65,105,255,.17);
}

.country-flag{
    width:28px;

    text-align:center;

    font-size:20px;
}


/* =========================
   BUTTON
========================= */

.download{
    width:100%;

    height:54px;

    margin-top:4px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #2f6bff,
            #5b35ff
        );

    color:#fff;

    font-size:16px;

    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(47,107,255,.25);
}

.download:active{
    transform:scale(.99);
}


/* =========================
   PREVIEW
========================= */

.preview-title{
    margin:28px 0 11px 3px;

    color:#8191ba;

    font-size:12px;

    font-weight:900;

    text-transform:uppercase;

    letter-spacing:1.2px;
}

.preview-wrap{
    width:100%;

    overflow-x:auto;

    overflow-y:hidden;

    border-radius:20px;
}


/* =========================
   ID CARD
========================= */

#idCard{

    position:relative;

    width:1200px;

    height:800px;

    overflow:hidden;

    border-radius:35px;

    background:
        #05091c
        url("mascot.png")
        center/cover
        no-repeat;

    color:#fff;
}


/* readability */

#idCard::after{

    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(3,7,27,.76) 0%,
            rgba(3,7,27,.48) 42%,
            rgba(3,7,27,.05) 75%
        );

    pointer-events:none;
}


/* =========================
   CARD CONTENT
========================= */

.card-content{

    position:absolute;

    z-index:3;

    left:70px;

    top:55px;

    width:600px;
}

.brand-name{

    font-family:"Space Grotesk",sans-serif;

    font-size:48px;

    line-height:1;

    font-weight:700;
}

.brand-sub{

    margin-top:9px;

    margin-bottom:40px;

    color:#7395ff;

    font-size:18px;

    font-weight:900;

    letter-spacing:5px;
}

.card-name{

    font-family:"Space Grotesk",sans-serif;

    font-size:40px;

    line-height:1.1;

    font-weight:700;

    margin-bottom:7px;

    word-break:break-word;
}

.card-x{

    color:#8da8ff;

    font-size:19px;

    font-weight:700;

    margin-bottom:27px;
}


/* =========================
   CARD DETAILS
========================= */

.details{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    column-gap:35px;

    row-gap:20px;
}

.detail{
    min-width:0;
}

.detail-full{
    grid-column:1/-1;

    padding-bottom:12px;

    border-bottom:
        1px solid
        rgba(86,119,220,.45);
}

.detail-label{

    display:block;

    color:#7093ff;

    font-size:12px;

    font-weight:900;

    letter-spacing:2.5px;

    margin-bottom:6px;
}

.detail-value{

    display:block;

    font-family:"Space Grotesk",sans-serif;

    color:#fff;

    font-size:20px;

    font-weight:700;

    line-height:1.2;

    word-break:break-word;
}


/* =========================
   CARD FOOTER
========================= */

.card-footer{

    position:absolute;

    z-index:4;

    left:70px;

    right:70px;

    bottom:35px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-size:14px;

    font-weight:800;
}

.footer-right{
    color:#ffffffc7;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        padding:
            15px
            9px
            35px;
    }

    .form-box{
        padding:15px;

        border-radius:17px;
    }

    .card-name{
        font-size:34px;
    }

    .preview-wrap{
        overflow-x:auto;
    }

}

</style>
</head>


<body>


<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>
            DliCOM ID Card
        </h1>

        <p>
            Create your DliCOM Community Identity
        </p>

    </div>


    <!-- FORM -->

    <div class="form-box">

        <div class="form-title">
            Create your card
        </div>


        <!-- NAME -->

        <div class="field">

            <label>
                Name
            </label>

            <input
                id="name"
                type="text"
                placeholder="𝐓𝐲𝐩𝐞 𝐬𝐨𝐦𝐞𝐭𝐡𝐢𝐧𝐠 𝐭𝐨 𝐬𝐭𝐚𝐫𝐭"
            >

        </div>


        <!-- X -->

        <div class="field">

            <label>
                X Username
            </label>

            <input
                id="xUsername"
                type="text"
                placeholder="@username"
            >

        </div>


        <!-- DISCORD -->

        <div class="field">

            <label>
                Discord Username
            </label>

            <input
                id="discord"
                type="text"
                placeholder="Discord username"
            >

        </div>


        <!-- GENDER -->

        <div class="field">

            <label>
                Gender
            </label>

            <select id="gender">

                <option value="">
                    Select gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <!-- ROLE -->

        <div class="field">

            <label>
                Roles
            </label>

            <div class="role-select">


                <div
                    class="role-button"
                    id="roleButton"
                >

                    <span
                        class="role-text"
                        id="roleText"
                    >
                        Select roles
                    </span>

                    <span>
                        ▼
                    </span>

                </div>


                <div
                    class="role-menu"
                    id="roleMenu"
                >


                    <label class="role-option">

                        <input
                            type="checkbox"
                            value="Dliever"
                        >

                        <span>
                            Dliever
                        </span>

                    </label>


                    <label class="role-option">

                        <input
                            type="checkbox"
                            value="Dcoded"
                        >

                        <span>
                            Dcoded
                        </span>

                    </label>


                    <label class="role-option">

                        <input
                            type="checkbox"
                            value="DCO"
                        >

                        <span>
                            DCO
                        </span>

                    </label>


                    <label class="role-option">

                        <input
                            type="checkbox"
                            value="Regional Helper"
                        >

                        <span>
                            Regional Helper
                        </span>

                    </label>


                    <label class="role-option">

                        <input
                            type="checkbox"
                            value="Regional Lead"
                        >

                        <span>
                            Regional Lead
                        </span>

                    </label>


                    <label class="role-option">

                        <input
                            type="checkbox"
                            value="MOD"
                        >

                        <span>
                            MOD
                        </span>

                    </label>


                    <label class="role-option">

                        <input
                            type="checkbox"
                            value="Team"
                        >

                        <span>
                            Team
                        </span>

                    </label>


                    <!-- OTHER ROLE -->

                    <label class="role-option">

                        <input
                            type="checkbox"
                            id="otherRoleCheck"
                            value="Other"
                        >

                        <span>
                            Other
                        </span>

                    </label>


                </div>

            </div>


            <input
                id="otherRole"
                class="other-role"
                type="text"
                placeholder="Type your role"
            >

        </div>


        <!-- COUNTRY -->

        <div class="field">

            <label>
                Country / Region
            </label>


            <div class="country-select">


                <div
                    class="country-button"
                    id="countryButton"
                >

                    <span
                        class="country-text"
                        id="countryText"
                    >
                        🌐 Select country
                    </span>

                    <span>
                        ▼
                    </span>

                </div>


                <div
                    class="country-menu"
                    id="countryMenu"
                >


                    <input
                        id="countrySearch"
                        class="country-search"
                        type="text"
                        placeholder="Search country..."
                    >


                    <div
                        class="country-list"
                        id="countryList"
                    ></div>


                </div>

            </div>

        </div>


        <!-- OG -->

        <div class="field">

            <label>
                OG Member
            </label>

            <select id="og">

                <option value="">
                    Select
                </option>

                <option value="Yes">
                    Yes
                </option>

                <option value="No">
                    No
                </option>

            </select>

        </div>


        <!-- MEMBER SINCE -->

        <div class="field">

            <label>
                Member Since
            </label>

            <input
                id="memberSince"
                type="month"
            >

        </div>


        <!-- DOWNLOAD -->

        <button
            class="download"
            id="downloadBtn"
        >
            Download PNG
        </button>

    </div>


    <!-- PREVIEW -->

    <div class="preview-title">
        Live Preview
    </div>


    <div class="preview-wrap">


        <div id="idCard">


            <div class="card-content">


                <!-- BRAND -->

                <div class="brand-name">
                    DliCOM
                </div>

                <div class="brand-sub">
                    COMMUNITY ID
                </div>


                <!-- NAME -->

                <div
                    class="card-name"
                    id="cardName"
                >
                    Your Name
                </div>


                <!-- X -->

                <div
                    class="card-x"
                    id="cardX"
                >
                    @username
                </div>


                <!-- DETAILS -->

                <div class="details">


                    <!-- ID -->

                    <div class="detail detail-full">

                        <span class="detail-label">
                            DLICOM ID
                        </span>

                        <span
                            class="detail-value"
                            id="cardId"
                        >
                            DLC-XXXXXX
                        </span>

                    </div>


                    <!-- ROLE -->

                    <div class="detail">

                        <span class="detail-label">
                            ROLE
                        </span>

                        <span
                            class="detail-value"
                            id="cardRole"
                        >
                            —
                        </span>

                    </div>


                    <!-- REGION -->

                    <div class="detail">

                        <span class="detail-label">
                            REGION
                        </span>

                        <span
                            class="detail-value"
                            id="cardCountry"
                        >
                            —
                        </span>

                    </div>


                    <!-- DISCORD -->

                    <div class="detail">

                        <span class="detail-label">
                            DISCORD
                        </span>

                        <span
                            class="detail-value"
                            id="cardDiscord"
                        >
                            —
                        </span>

                    </div>


                    <!-- GENDER -->

                    <div class="detail">

                        <span class="detail-label">
                            GENDER
                        </span>

                        <span
                            class="detail-value"
                            id="cardGender"
                        >
                            —
                        </span>

                    </div>


                    <!-- OG -->

                    <div class="detail">

                        <span class="detail-label">
                            OG MEMBER
                        </span>

                        <span
                            class="detail-value"
                            id="cardOG"
                        >
                            —
                        </span>

                    </div>


                    <!-- MEMBER SINCE -->

                    <div class="detail">

                        <span class="detail-label">
                            MEMBER SINCE
                        </span>

                        <span
                            class="detail-value"
                            id="cardSince"
                        >
                            —
                        </span>

                    </div>


                </div>

            </div>


            <!-- FOOTER -->

            <div class="card-footer">

                <span>
                    Official DliCOM Community Member
                </span>

                <span class="footer-right">
                    dlicom.app
                </span>

            </div>


        </div>

    </div>

</div>

/* =========================
   DLICOM ID
========================= */

function generateId(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let result = "DLC-";

    for(let i=0;i<6;i++){

        result +=
            chars[
                Math.floor(
                    Math.random() *
                    chars.length
                )
            ];

    }

    return result;
}

const dlicomId =
    generateId();

document.getElementById(
    "cardId"
).textContent =
    dlicomId;


/* =========================
   COUNTRY LIST
========================= */

function renderCountries(
    search = ""
){

    countryList.innerHTML = "";

    const query =
        search
        .toLowerCase()
        .trim();


    countries
    .filter(function(item){

        return item[1]
        .toLowerCase()
        .includes(query);

    })
    .forEach(function(item){

        const div =
            document.createElement("div");

        div.className =
            "country-item";

        div.innerHTML = `

            <span class="country-flag">
                ${item[0]}
            </span>

            <span>
                ${item[1]}
            </span>

        `;


        div.addEventListener(
            "click",
            function(){

                countryText.textContent =
                    item[0] +
                    " " +
                    item[1];


                document.getElementById(
                    "cardCountry"
                ).textContent =
                    item[0] +
                    " " +
                    item[1];


                countryMenu
                .classList
                .remove("open");

                countrySearch.value = "";

            }
        );


        countryList.appendChild(div);

    });


    /* OTHER */

    const other =
        document.createElement("div");

    other.className =
        "country-item";

    other.innerHTML = `
        <span class="country-flag">🌐</span>
        <span>Other</span>
    `;


    other.addEventListener(
        "click",
        function(){

            countryText.textContent =
                "🌐 Other";


            document.getElementById(
                "cardCountry"
            ).textContent =
                "🌐 Other";


            countryMenu
            .classList
            .remove("open");

            countrySearch.value = "";

        }
    );


    countryList.appendChild(other);

}


renderCountries();

/* =========================
   GET ROLES
========================= */

function getRoles(){

    const checked =
        [
            ...roleMenu.querySelectorAll(
                'input[type="checkbox"]:checked'
            )
        ];


    let roles =
        checked.map(
            checkbox =>
            checkbox.value
        );


    if(
        otherRoleCheck.checked &&
        otherRole.value.trim()
    ){

        roles =
            roles.filter(
                role =>
                role !== "Other"
            );


        roles.push(
            otherRole.value.trim()
        );

    }


    return roles;

}


/* =========================
   UPDATE ROLES
========================= */

function updateRoles(){

    const roles =
        getRoles();


    roleText.textContent =
        roles.length
        ? roles.join(" • ")
        : "Select roles";


    document.getElementById(
        "cardRole"
    ).textContent =
        roles.length
        ? roles.join(" • ")
        : "—";

}


roleMenu
.querySelectorAll(
    'input[type="checkbox"]'
)
.forEach(
    checkbox => {

        checkbox.addEventListener(
            "change",
            function(){

                if(
                    this ===
                    otherRoleCheck
                ){

                    if(this.checked){

                        otherRole
                        .classList
                        .add("show");

                    }
                    else{

                        otherRole
                        .classList
                        .remove("show");

                        otherRole.value = "";

                    }

                }


                updateRoles();

            }
        );

    }
);


otherRole.addEventListener(
    "input",
    updateRoles
);

/* =========================
   MEMBER SINCE
========================= */

memberSince.addEventListener(
    "change",
    function(){

        if(!this.value){

            document.getElementById(
                "cardSince"
            ).textContent =
                "—";

            return;

        }


        const parts =
            this.value.split("-");


        const year =
            parts[0];

        const month =
            parseInt(
                parts[1],
                10
            );


        const months = [

            "Jan",
            "Feb",
            "Mar",
            "Apr",
            "May",
            "Jun",
            "Jul",
            "Aug",
            "Sep",
            "Oct",
            "Nov",
            "Dec"

        ];


        document.getElementById(
            "cardSince"
        ).textContent =
            months[month - 1] +
            " " +
            year;

    }
);


/* =========================
   DOWNLOAD
========================= */

document.getElementById(
    "downloadBtn"
)
.addEventListener(
    "click",
    async function(){

        const button =
            this;


        button.textContent =
            "Generating...";


        button.disabled =
            true;


        try{

            const card =
                document.getElementById(
                    "idCard"
                );


            const canvas =
                await html2canvas(
                    card,
                    {
                        scale:3,

                        useCORS:true,

                        allowTaint:true,

                        backgroundColor:
                            "#050713",

                        logging:false,

                        imageTimeout:15000
                    }
                );


            const link =
                document.createElement(
                    "a"
                );


            const memberName =
                nameInput
                .value
                .trim()
                .replace(
                    /[^a-z0-9_-]/gi,
                    "-"
                );


            link.download =
                "DliCOM-ID-" +
                (
                    memberName ||
                    dlicomId
                ) +
                ".png";


            link.href =
                canvas.toDataURL(
                    "image/png"
                );


            link.click();

        }
        catch(error){

            console.error(error);

            alert(
                "PNG তৈরি করা যায়নি। আবার চেষ্টা করো।"
            );

        }


        button.textContent =
            "Download PNG";


        button.disabled =
            false;

    }
);
