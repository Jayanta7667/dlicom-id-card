<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DliCOM Community ID</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    padding: 22px 14px 50px;

    font-family: "Inter", sans-serif;

    color: #fff;

    background:
        radial-gradient(
            circle at 50% 0%,
            #172d79 0%,
            #070d29 38%,
            #02030c 100%
        );
}

.container {
    width: 100%;
    max-width: 1050px;
    margin: auto;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.header h1 {
    font-family: "Space Grotesk", sans-serif;
    font-size: clamp(30px, 6vw, 48px);
    font-weight: 800;
    letter-spacing: -1px;
}

.header p {
    margin-top: 7px;
    color: #9ba9cf;
    font-size: 14px;
    font-weight: 700;
}

.form-box {
    padding: 22px;

    border-radius: 22px;

    background: rgba(7, 14, 40, .92);

    border: 1px solid rgba(86, 121, 255, .35);

    box-shadow:
        0 20px 60px rgba(0,0,0,.35);

    backdrop-filter: blur(15px);

    margin-bottom: 28px;
}

.form-title {
    font-family: "Space Grotesk", sans-serif;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 18px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.field {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.full {
    grid-column: 1 / -1;
}

label {
    color: #91a8e9;

    font-size: 11px;
    font-weight: 900;

    text-transform: uppercase;
    letter-spacing: .8px;
}

input,
select {
    width: 100%;
    height: 50px;

    padding: 0 15px;

    border-radius: 12px;

    border: 1px solid #26396e;

    outline: none;

    background: #080f2b;
    color: #fff;

    font-family: "Inter", sans-serif;
    font-size: 14px;
    font-weight: 800;

    transition: .2s;
}

input::placeholder {
    color: #8793b2;
    font-weight: 800;
}

input:focus,
select:focus {
    border-color: #507dff;

    box-shadow:
        0 0 0 3px rgba(80,125,255,.12);
}

select option {
    background: #080f2b;
    color: #fff;
    font-weight: 700;
}

/* ROLE */

.role-select {
    position: relative;
}

.role-trigger {
    width: 100%;
    height: 50px;

    padding: 0 15px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-radius: 12px;

    border: 1px solid #26396e;

    background: #080f2b;
    color: #fff;

    font-family: "Inter", sans-serif;
    font-size: 14px;
    font-weight: 800;

    cursor: pointer;

    text-align: left;
}

.role-trigger:hover {
    border-color: #507dff;
}

.role-menu {
    display: none;

    position: absolute;

    z-index: 100;

    top: 57px;
    left: 0;
    right: 0;

    max-height: 280px;

    overflow-y: auto;

    padding: 8px;

    border-radius: 13px;

    background: #070d25;

    border: 1px solid #30467e;

    box-shadow:
        0 20px 45px rgba(0,0,0,.55);
}

.role-menu.show {
    display: block;
}

.role-option {
    display: flex;
    flex-direction: row;
    align-items: center;

    gap: 10px;

    padding: 12px;

    border-radius: 8px;

    color: #fff;

    cursor: pointer;

    font-size: 14px;
    font-weight: 800;

    text-transform: none;
    letter-spacing: 0;
}

.role-option:hover {
    background: rgba(65,105,255,.15);
}

.role-option input {
    width: 18px;
    height: 18px;

    accent-color: #4f7dff;

    cursor: pointer;
}

/* BUTTONS */

.buttons {
    display: flex;
    gap: 12px;
    margin-top: 20px;
}

button {
    border: 0;

    font-family: "Inter", sans-serif;
    font-weight: 900;

    cursor: pointer;

    transition: .2s;
}

.generate {
    flex: 1;

    padding: 14px 20px;

    border-radius: 12px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #2f6bff,
            #5b35ff
        );
}

.generate:hover {
    transform: translateY(-1px);

    box-shadow:
        0 10px 30px rgba(47,107,255,.3);
}

.download {
    min-width: 160px;

    padding: 14px 20px;

    border-radius: 12px;

    background: #fff;

    color: #07102d;
}

/* CARD */

.preview-title {
    margin: 0 0 12px 4px;

    color: #8191ba;

    font-size: 12px;
    font-weight: 900;

    text-transform: uppercase;
    letter-spacing: 1.2px;
}

.card-wrap {
    width: 100%;
    overflow: hidden;
    border-radius: 22px;
}

.id-card {
    position: relative;

    width: 100%;

    aspect-ratio: 1536 / 1024;

    overflow: hidden;

    border-radius: 22px;

    background-image: url("card-bg.png");

    background-size: cover;
    background-position: center;

    box-shadow:
        0 25px 70px rgba(0,0,0,.5),
        0 0 45px rgba(52,91,255,.18);
}

.card-info {
    position: absolute;

    left: 5.8%;
    top: 20%;

    width: 45%;

    z-index: 5;
}

.brand {
    font-family: "Space Grotesk", sans-serif;

    font-size: clamp(17px, 2.4vw, 34px);

    font-weight: 800;

    margin-bottom: 2px;
}

.community {
    color: #7196ff;

    font-size: clamp(7px, .85vw, 12px);

    font-weight: 900;

    letter-spacing: 3px;

    margin-bottom: 8%;
}

.name {
    font-family: "Space Grotesk", sans-serif;

    font-size: clamp(18px, 3vw, 42px);

    font-weight: 800;

    line-height: 1.05;

    margin-bottom: 5px;

    text-shadow:
        0 3px 15px rgba(0,0,0,.5);
}

.xname {
    color: #91a9ed;

    font-size: clamp(9px, 1.2vw, 16px);

    font-weight: 700;

    margin-bottom: 6%;
}

.details {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px 18px;
}

.detail-label {
    display: block;

    color: #6d93ff;

    font-size: clamp(6px, .7vw, 10px);

    font-weight: 900;

    letter-spacing: 1.3px;

    margin-bottom: 3px;
}

.detail-value {
    display: block;

    color: #fff;

    font-size: clamp(8px, .95vw, 14px);

    font-weight: 800;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.id-line {
    display: inline-flex;

    align-items: center;

    gap: 7px;

    margin-top: 7%;

    padding: 7px 11px;

    border-radius: 8px;

    background: rgba(4,10,35,.72);

    border: 1px solid rgba(105,140,255,.3);
}

.id-label {
    color: #7798ff;

    font-size: clamp(6px, .7vw, 10px);

    font-weight: 900;

    letter-spacing: 1px;
}

.id-value {
    color: #fff;

    font-size: clamp(7px, .85vw, 12px);

    font-weight: 900;
}

.footer {
    position: absolute;

    left: 5.8%;
    bottom: 5.5%;

    color: rgba(255,255,255,.9);

    font-size: clamp(7px, .8vw, 12px);

    font-weight: 800;
}

.footer-right {
    position: absolute;

    right: 5.8%;
    bottom: 5.5%;

    color: rgba(255,255,255,.75);

    font-size: clamp(7px, .8vw, 12px);

    font-weight: 800;
}

@media (max-width: 650px) {

    body {
        padding: 15px 10px 35px;
    }

    .form-box {
        padding: 16px;
        border-radius: 18px;
    }

    .grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

    .buttons {
        flex-direction: column;
    }

    .download {
        width: 100%;
    }

    .card-wrap,
    .id-card {
        border-radius: 14px;
    }
}

</style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>DliCOM ID Card</h1>

        <p>Create your DliCOM Community Identity</p>

    </div>


    <div class="form-box">

        <div class="form-title">
            Create your card
        </div>

        <div class="grid">

            <div class="field full">

                <label>Full Name</label>

                <input
                    id="name"
                    type="text"
                    placeholder="𝐓𝐲𝐩𝐞 𝐬𝐨𝐦𝐞𝐭𝐡𝐢𝐧𝐠 𝐭𝐨 𝐬𝐭𝐚𝐫𝐭"
                >

            </div>


            <div class="field">

                <label>X Username</label>

                <input
                    id="xusername"
                    type="text"
                    placeholder="𝐓𝐲𝐩𝐞 𝐬𝐨𝐦𝐞𝐭𝐡𝐢𝐧𝐠 𝐭𝐨 𝐬𝐭𝐚𝐫𝐭"
                >

            </div>


            <div class="field">

                <label>Discord Username</label>

                <input
                    id="discord"
                    type="text"
                    placeholder="𝐓𝐲𝐩𝐞 𝐬𝐨𝐦𝐞𝐭𝐡𝐢𝐧𝐠 𝐭𝐨 𝐬𝐭𝐚𝐫𝐭"
                >

            </div>


            <div class="field">

                <label>Gender</label>

                <select id="gender">

                    <option value="">𝐓𝐲𝐩𝐞 𝐬𝐨𝐦𝐞𝐭𝐡𝐢𝐧𝐠 𝐭𝐨 𝐬𝐭𝐚𝐫𝐭</option>

                    <option value="Male">Male</option>

                    <option value="Female">Female</option>

                    <option value="Prefer not to say">
                        Prefer not to say
                    </option>

                </select>

            </div>


            <div class="field">

                <label>Roles</label>

                <div class="role-select">

                    <button
                        type="button"
                        class="role-trigger"
                        onclick="toggleRoles()"
                    >

                        <span id="rolePlaceholder">
                            𝐓𝐲𝐩𝐞 𝐬𝐨𝐦𝐞𝐭𝐡𝐢𝐧𝐠 𝐭𝐨 𝐬𝐭𝐚𝐫𝐭
                        </span>

                        <span>▼</span>

                    </button>


                    <div
                        class="role-menu"
                        id="roleMenu"
                    >

                        <label class="role-option">
                            <input type="checkbox" value="Dliever">
                            <span>Dliever</span>
                        </label>

                        <label class="role-option">
                            <input type="checkbox" value="Dcoded">
                            <span>Dcoded</span>
                        </label>

                        <label class="role-option">
                            <input type="checkbox" value="DCO">
                            <span>DCO</span>
                        </label>

                        <label class="role-option">
                            <input type="checkbox" value="Regional Helper">
                            <span>Regional Helper</span>
                        </label>

                        <label class="role-option">
                            <input type="checkbox" value="Regional Lead">
                            <span>Regional Lead</span>
                        </label>

                        <label class="role-option">
                            <input type="checkbox" value="MOD">
                            <span>MOD</span>
                        </label>

                        <label class="role-option">
                            <input type="checkbox" value="Team">
                            <span>Team</span>
                        </label>

                    </div>

                </div>

            </div>


            <div class="field">

                <label>Country</label>

                <select id="country">

                    <option value="">
                        𝐓𝐲𝐩𝐞 𝐬𝐨𝐦𝐞𝐭𝐡𝐢𝐧𝐠 𝐭𝐨 𝐬𝐭𝐚𝐫𝐭
                    </option>

                </select>

            </div>


            <div class="field">

                <label>OG Member</label>

                <select id="og">

                    <option value="">
                        𝐓𝐲𝐩𝐞 𝐬𝐨𝐦𝐞𝐭𝐡𝐢𝐧𝐠 𝐭𝐨 𝐬𝐭𝐚𝐫𝐭
                    </option>

                    <option value="Yes">Yes</option>

                    <option value="No">No</option>

                </select>

            </div>


            <div class="field">

                <label>Member Since</label>

                <input
                    id="memberSince"
                    type="month"
                >

            </div>

        </div>


        <div class="buttons">

            <button
                class="generate"
                onclick="updateCard()"
            >
                Generate Card
            </button>

            <button
                class="download"
                onclick="downloadCard()"
            >
                Download PNG
            </button>

        </div>

    </div>


    <div class="preview-title">
        Live Preview
    </div>


    <div class="card-wrap">

        <div
            class="id-card"
            id="idCard"
        >

            <div class="card-info">

                <div class="brand">
                    DliCOM
                </div>

                <div class="community">
                    COMMUNITY ID
                </div>

                <div
                    class="name"
                    id="cardName"
                >
                    Your Name
                </div>

                <div
                    class="xname"
                    id="cardX"
                >
                    @username
                </div>


                <div class="details">


                    <div class="detail">

                        <span class="detail-label">
                            ROLE
                        </span>

                        <span
                            class="detail-value"
                            id="cardRole"
                        >
                            —
                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            REGION
                        </span>

                        <span
                            class="detail-value"
                            id="cardCountry"
                        >
                            —
                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            DISCORD
                        </span>

                        <span
                            class="detail-value"
                            id="cardDiscord"
                        >
                            —
                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            GENDER
                        </span>

                        <span
                            class="detail-value"
                            id="cardGender"
                        >
                            —
                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            OG MEMBER
                        </span>

                        <span
                            class="detail-value"
                            id="cardOG"
                        >
                            —
                        </span>

                    </div>


                    <div class="detail">

                        <span class="detail-label">
                            MEMBER SINCE
                        </span>

                        <span
                            class="detail-value"
                            id="cardSince"
                        >
                            —
                        </span>

                    </div>

                </div>


                <div class="id-line">

                    <span class="id-label">
                        DLICOM ID
                    </span>

                    <span
                        class="id-value"
                        id="cardId"
                    >
                        DLC-000000
                    </span>

                </div>

            </div>


            <div class="footer">
                Official DliCOM Community Member
            </div>

            <div class="footer-right">
                dlicom.app
            </div>

        </div>

    </div>

</div>
