<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DliCOM ID Card Generator</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    padding:18px 10px 50px;
    font-family:Inter,Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(
            circle at 50% 0%,
            #1b3180 0%,
            #080d29 38%,
            #02030b 100%
        );
}

.container{
    width:100%;
    max-width:850px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:24px;
}

.header h1{
    font-family:"Space Grotesk",sans-serif;
    font-size:clamp(28px,6vw,46px);
    font-weight:800;
}

.header p{
    margin-top:7px;
    color:#9aa9d0;
    font-size:14px;
    font-weight:700;
}

.form-box{
    padding:20px;
    border-radius:20px;
    background:rgba(7,14,40,.96);
    border:1px solid rgba(86,121,255,.35);
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}

.form-title{
    margin-bottom:18px;
    font-family:"Space Grotesk",sans-serif;
    font-size:21px;
    font-weight:800;
}

.field{
    margin-bottom:17px;
    position:relative;
}

label{
    display:block;
    margin-bottom:7px;
    color:#91a8e9;
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1px;
}

input,
select{
    width:100%;
    height:50px;
    padding:0 14px;
    border:1px solid #293b72;
    border-radius:11px;
    outline:none;
    background:#080f2b;
    color:#fff;
    font-family:Inter,sans-serif;
    font-size:14px;
    font-weight:700;
}

input::placeholder{
    color:#7f8ba9;
}

input:focus,
select:focus{
    border-color:#527dff;
    box-shadow:0 0 0 3px rgba(82,125,255,.12);
}

select option{
    background:#080f2b;
    color:#fff;
}


/* =========================
   ROLE DROPDOWN
========================= */

.role-select{
    position:relative;
}

.role-button{
    width:100%;
    min-height:50px;
    padding:0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border:1px solid #293b72;
    border-radius:11px;
    background:#080f2b;
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.role-button:hover{
    border-color:#527dff;
}

.role-text{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.role-menu{
    display:none;
    position:absolute;
    z-index:100;
    top:57px;
    left:0;
    right:0;
    max-height:330px;
    overflow-y:auto;
    padding:8px;
    border:1px solid #30467e;
    border-radius:14px;
    background:#070d25;
    box-shadow:0 20px 50px rgba(0,0,0,.7);
}

.role-menu.open{
    display:block;
}

.role-option{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px;
    border-radius:8px;
    color:#fff;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
    text-transform:none;
    letter-spacing:0;
}

.role-option:hover{
    background:rgba(65,105,255,.17);
}

.role-option input{
    width:18px;
    height:18px;
    accent-color:#527dff;
}


/* =========================
   COUNTRY SEARCH
========================= */

.country-select{
    position:relative;
}

.country-button{
    width:100%;
    min-height:50px;
    padding:0 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    border:1px solid #293b72;
    border-radius:11px;
    background:#080f2b;
    color:#fff;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
}

.country-button:hover{
    border-color:#527dff;
}

.country-text{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.country-menu{
    display:none;
    position:absolute;
    z-index:200;
    top:57px;
    left:0;
    right:0;
    padding:9px;
    border:1px solid #30467e;
    border-radius:14px;
    background:#070d25;
    box-shadow:0 20px 50px rgba(0,0,0,.7);
}

.country-menu.open{
    display:block;
}

.country-search{
    margin-bottom:8px;
}

.country-list{
    max-height:290px;
    overflow-y:auto;
}

.country-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:11px;
    border-radius:8px;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
}

.country-item:hover{
    background:rgba(65,105,255,.17);
}

.country-flag{
    width:28px;
    text-align:center;
    font-size:20px;
}


/* =========================
   GENERATE / DOWNLOAD
========================= */

.buttons{
    display:flex;
    gap:10px;
    margin-top:5px;
}

.generate,
.download{
    flex:1;
    height:54px;
    border:0;
    border-radius:12px;
    font-family:Inter,sans-serif;
    font-size:15px;
    font-weight:900;
    cursor:pointer;
}

.generate{
    color:#fff;
    background:linear-gradient(135deg,#2f6bff,#5b35ff);
}

.download{
    display:none;
    color:#07102d;
    background:#fff;
}

.download.show{
    display:block;
}

.generate:disabled,
.download:disabled{
    opacity:.6;
    cursor:not-allowed;
}


/* =========================
   PREVIEW
========================= */

.preview-title{
    margin:28px 0 11px 3px;
    color:#8191ba;
    font-size:12px;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:1.2px;
}

.preview-wrap{
    width:100%;
    overflow-x:auto;
    overflow-y:hidden;
    border-radius:20px;
}


/* =========================
   CARD
========================= */

#idCard{
    position:relative;
    width:1200px;
    height:800px;
    overflow:hidden;
    border-radius:35px;

    background:
        #05091c
        url("card-bg.png")
        center/cover
        no-repeat;

    color:#fff;
}

#idCard::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(3,7,27,.78) 0%,
            rgba(3,7,27,.52) 43%,
            rgba(3,7,27,.08) 78%
        );

    pointer-events:none;
}


/* =========================
   CARD CONTENT
========================= */

.card-content{
    position:absolute;
    z-index:3;
    left:70px;
    top:55px;
    width:610px;
}

.brand-name{
    font-family:"Space Grotesk",sans-serif;
    font-size:48px;
    line-height:1;
    font-weight:700;
}

.brand-sub{
    margin-top:9px;
    margin-bottom:35px;
    color:#7395ff;
    font-size:18px;
    font-weight:900;
    letter-spacing:5px;
}

.card-name{
    margin-bottom:7px;
    font-family:"Space Grotesk",sans-serif;
    font-size:40px;
    line-height:1.1;
    font-weight:700;
    word-break:break-word;
}

.card-x{
    margin-bottom:25px;
    color:#8da8ff;
    font-size:19px;
    font-weight:700;
}


/* =========================
   CARD DETAILS
========================= */

.details{
    display:grid;
    grid-template-columns:1fr 1fr;
    column-gap:35px;
    row-gap:18px;
}

.detail{
    min-width:0;
}

.detail-full{
    grid-column:1/-1;
    padding-bottom:11px;
    border-bottom:1px solid rgba(86,119,220,.45);
}

.detail-label{
    display:block;
    margin-bottom:5px;
    color:#7093ff;
    font-size:12px;
    font-weight:900;
    letter-spacing:2.3px;
}

.detail-value{
    display:block;
    color:#fff;
    font-family:"Space Grotesk",sans-serif;
    font-size:19px;
    font-weight:700;
    line-height:1.2;
    word-break:break-word;
}


/* =========================
   CARD FOOTER
========================= */

.card-footer{
    position:absolute;
    z-index:4;
    left:70px;
    right:70px;
    bottom:35px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    font-size:14px;
    font-weight:800;
}

.footer-right{
    color:#ffffffc7;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    body{
        padding:14px 8px 35px;
    }

    .form-box{
        padding:15px;
        border-radius:17px;
    }

    .buttons{
        flex-direction:column;
    }

    #idCard{
        border-radius:20px;
    }

}

</style>
</head>


<body>

<div class="container">


    <!-- HEADER -->

    <div class="header">

        <h1>DliCOM ID Card</h1>

        <p>
            Create your DliCOM Community Identity
        </p>

    </div>


    <!-- FORM -->

    <div class="form-box">

        <div class="form-title">
            Create your card
        </div>


        <!-- NAME -->

        <div class="field">

            <label>Name</label>

            <input
                id="name"
                type="text"
                placeholder="𝐓𝐲𝐩𝐞 𝐬𝐨𝐦𝐞𝐭𝐡𝐢𝐧𝐠 𝐭𝐨 𝐬𝐭𝐚𝐫𝐭"
            >

        </div>


        <!-- X USERNAME -->

        <div class="field">

            <label>X Username</label>

            <input
                id="xUsername"
                type="text"
                placeholder="@username"
            >

        </div>


        <!-- DISCORD -->

        <div class="field">

            <label>Discord Username</label>

            <input
                id="discord"
                type="text"
                placeholder="Discord username"
            >

        </div>


        <!-- GENDER -->

        <div class="field">

            <label>Gender</label>

            <select id="gender">

                <option value="">
                    Select gender
                </option>

                <option value="Male">
                    Male
                </option>

                <option value="Female">
                    Female
                </option>

                <option value="Other">
                    Other
                </option>

            </select>

        </div>


        <!-- ROLE -->

        <div class="field">

            <label>Roles</label>

            <div class="role-select">

                <div
                    class="role-button"
                    id="roleButton"
                >

                    <span
                        class="role-text"
                        id="roleText"
                    >
                        Select roles
                    </span>

                    <span>▼</span>

                </div>


                <div
                    class="role-menu"
                    id="roleMenu"
                >

                    <!-- Dliever -->

                    <label class="role-option">

                        <input
                            type="checkbox"
                            value="Dliever"
                        >

                        <span>Dliever</span>

                    </label>


                    <!-- Dcoded -->

                    <label class="role-option">

                        <input
                            type="checkbox"
                            value="Dcoded"
                        >

                        <span>Dcoded</span>

                    </label>


                    <!-- DCO -->

                    <label class="role-option">

                        <input
                            type="checkbox"
                            value="DCO"
                        >

                        <span>DCO</span>

                    </label>


                    <!-- Regional Helper -->

                    <label class="role-option">

                        <input
                            type="checkbox"
                            value="Regional Helper"
                        >

                        <span>Regional Helper</span>

                    </label>


                    <!-- Regional Lead -->

                    <label class="role-option">

                        <input
                            type="checkbox"
                            value="Regional Lead"
                        >

                        <span>Regional Lead</span>

                    </label>


                    <!-- MOD -->

                    <label class="role-option">

                        <input
                            type="checkbox"
                            value="MOD"
                        >

                        <span>MOD</span>

                    </label>


                    <!-- Team -->

                    <label class="role-option">

                        <input
                            type="checkbox"
                            value="Team"
                        >

                        <span>Team</span>

                    </label>

                </div>

            </div>

        </div>


        <!-- COUNTRY -->

        <div class="field">

            <label>Country / Region</label>

            <div class="country-select">

                <div
                    class="country-button"
                    id="countryButton"
                >

                    <span
                        class="country-text"
                        id="countryText"
                    >
                        🌐 Select country
                    </span>

                    <span>▼</span>

                </div>


                <div
                    class="country-menu"
                    id="countryMenu"
                >

                    <input
                        id="countrySearch"
                        class="country-search"
                        type="text"
                        placeholder="Search country..."
                    >


                    <div
                        class="country-list"
                        id="countryList"
                    ></div>

                </div>

            </div>

        </div>


        <!-- OG MEMBER -->

        <div class="field">

            <label>OG Member</label>

            <select id="og">

                <option value="">
                    Select
                </option>

                <option value="Yes">
                    Yes
                </option>

                <option value="No">
                    No
                </option>

            </select>

        </div>


        <!-- MEMBER SINCE -->

        <div class="field">

            <label>Member Since</label>

            <input
                id="memberSince"
                type="month"
            >

        </div>


        <!-- BUTTONS -->

        <div class="buttons">

            <button
                class="generate"
                id="generateBtn"
            >
                Generate PNG
            </button>


            <button
                class="download"
                id="downloadBtn"
            >
                Download PNG
            </button>

        </div>

    </div>


    <!-- PREVIEW -->

    <div class="preview-title">
        Live Preview
    </div>


    <div class="preview-wrap">

        <div id="idCard">


            <div class="card-content">


                <div class="brand-name">
                    DliCOM
                </div>

                <div class="brand-sub">
                    COMMUNITY ID
                </div>


                <div
                    class="card-name"
                    id="cardName"
                >
                    Your Name
                </div>


                <div
                    class="card-x"
                    id="cardX"
                >
                    @username
                </div>


                <div class="details">


                    <!-- DLICOM ID -->

                    <div class="detail detail-full">

                        <span class="detail-label">
                            DLICOM ID
                        </span>

                        <span
                            class="detail-value"
                            id="cardId"
                        >
                            DLC-XXXXXX
                        </span>

                    </div>


                    <!-- ROLE -->

                    <div class="detail">

                        <span class="detail-label">
                            ROLE
                        </span>

                        <span
                            class="detail-value"
                            id="cardRole"
                        >
                            —
                        </span>

                    </div>


                    <!-- REGION -->

                    <div class="detail">

                        <span class="detail-label">
                            REGION
                        </span>

                        <span
                            class="detail-value"
                            id="cardCountry"
                        >
                            —
                        </span>

                    </div>


                    <!-- DISCORD -->

                    <div class="detail">

                        <span class="detail-label">
                            DISCORD
                        </span>

                        <span
                            class="detail-value"
                            id="cardDiscord"
                        >
                            —
                        </span>

                    </div>


                    <!-- GENDER -->

                    <div class="detail">

                        <span class="detail-label">
                            GENDER
                        </span>

                        <span
                            class="detail-value"
                            id="cardGender"
                        >
                            —
                        </span>

                    </div>


                    <!-- OG MEMBER -->

                    <div class="detail">

                        <span class="detail-label">
                            OG MEMBER
                        </span>

                        <span
                            class="detail-value"
                            id="cardOG"
                        >
                            —
                        </span>

                    </div>


                    <!-- MEMBER SINCE -->

                    <div class="detail">

                        <span class="detail-label">
                            MEMBER SINCE
                        </span>

                        <span
                            class="detail-value"
                            id="cardSince"
                        >
                            —
                        </span>

                    </div>

                </div>

            </div>


            <div class="card-footer">

                <span>
                    Official DliCOM Community Member
                </span>

                <span class="footer-right">
                    dlicom.app
                </span>

            </div>

        </div>

    </div>

</div>

/* =========================
   DLICOM ID
========================= */

function createDliComId(){

    const chars =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let id = "DLC-";

    for(let i = 0; i < 6; i++){

        id += chars[
            Math.floor(
                Math.random() * chars.length
            )
        ];

    }

    return id;
}

let dlicomId =
    createDliComId();


/* =========================
   COUNTRY RENDER
========================= */

function renderCountries(search = ""){

    countryList.innerHTML = "";

    const query =
        search.toLowerCase().trim();


    const filtered =
        countries.filter(
            item =>
            item[1]
            .toLowerCase()
            .includes(query)
        );


    filtered.forEach(function(item){

        const div =
            document.createElement("div");

        div.className =
            "country-item";

        div.innerHTML = `
            <span class="country-flag">
                ${item[0]}
            </span>

            <span>
                ${item[1]}
            </span>
        `;


        div.addEventListener(
            "click",
            function(){

                countryText.textContent =
                    item[0] +
                    " " +
                    item[1];


                countryText.dataset.country =
                    item[1];

                countryText.dataset.flag =
                    item[0];


                countryMenu
                    .classList
                    .remove("open");

                countrySearch.value = "";

            }
        );


        countryList.appendChild(div);

    });


    /* OTHER */

    const other =
        document.createElement("div");

    other.className =
        "country-item";

    other.innerHTML = `
        <span class="country-flag">🌐</span>
        <span>Other</span>
    `;


    other.addEventListener(
        "click",
        function(){

            countryText.textContent =
                "🌐 Other";

            countryText.dataset.country =
                "Other";

            countryText.dataset.flag =
                "🌐";

            countryMenu
                .classList
                .remove("open");

            countrySearch.value = "";

        }
    );


    countryList.appendChild(other);

}


renderCountries();

/* =========================
   ROLE UPDATE
========================= */

function getRoles(){

    return [
        ...roleMenu.querySelectorAll(
            'input[type="checkbox"]:checked'
        )
    ].map(
        checkbox =>
        checkbox.value
    );

}


function updateRoleText(){

    const roles =
        getRoles();


    roleText.textContent =
        roles.length
        ? roles.join(" • ")
        : "Select roles";

}


roleMenu
.querySelectorAll(
    'input[type="checkbox"]'
)
.forEach(function(checkbox){

    checkbox.addEventListener(
        "change",
        updateRoleText
    );

});

/* =========================
   GENERATE CARD
========================= */

function generateCard(){

    const name =
        nameInput.value.trim();

    const xUsername =
        xInput.value.trim();

    const discord =
        discordInput.value.trim();

    const gender =
        genderInput.value;

    const roles =
        getRoles();

    const country =
        countryText.dataset.country || "";

    const flag =
        countryText.dataset.flag || "";

    const og =
        ogInput.value;

    const since =
        sinceInput.value;


    /* NEW ID */

    dlicomId =
        createDliComId();


    /* NAME */

    document.getElementById(
        "cardName"
    ).textContent =
        name || "Your Name";


    /* X */

    let x =
        xUsername;

    if(
        x &&
        !x.startsWith("@")
    ){

        x = "@" + x;

    }

    document.getElementById(
        "cardX"
    ).textContent =
        x || "@username";


    /* DLICOM ID */

    document.getElementById(
        "cardId"
    ).textContent =
        dlicomId;


    /* ROLE */

    document.getElementById(
        "cardRole"
    ).textContent =
        roles.length
        ? roles.join(" • ")
        : "—";


    /* COUNTRY */

    document.getElementById(
        "cardCountry"
    ).textContent =
        country
        ? flag + " " + country
        : "—";


    /* DISCORD */

    document.getElementById(
        "cardDiscord"
    ).textContent =
        discord || "—";


    /* GENDER */

    document.getElementById(
        "cardGender"
    ).textContent =
        gender || "—";


    /* OG */

    document.getElementById(
        "cardOG"
    ).textContent =
        og || "—";


    /* MEMBER SINCE */

    if(since){

        const parts =
            since.split("-");

        const year =
            parts[0];

        const month =
            parseInt(
                parts[1],
                10
            );

        const months = [
            "Jan",
            "Feb",
            "Mar",
            "Apr",
            "May",
            "Jun",
            "Jul",
            "Aug",
            "Sep",
            "Oct",
            "Nov",
            "Dec"
        ];

        document.getElementById(
            "cardSince"
        ).textContent =
            months[month - 1] +
            " " +
            year;

    }
    else{

        document.getElementById(
            "cardSince"
        ).textContent =
            "—";

    }


    /* SHOW DOWNLOAD */

    downloadBtn
        .classList
        .add("show");


    /* BUTTON TEXT */

    generateBtn.textContent =
        "Generated ✓";

}


/* =========================
   GENERATE BUTTON
========================= */

generateBtn.addEventListener(
    "click",
    generateCard
);


/* =========================
   DOWNLOAD PNG
========================= */

downloadBtn.addEventListener(
    "click",
    async function(){

        downloadBtn.textContent =
            "Generating...";

        downloadBtn.disabled =
            true;


        try{

            const card =
                document.getElementById(
                    "idCard"
                );


            const canvas =
                await html2canvas(
                    card,
                    {
                        scale:3,
                        useCORS:true,
                        allowTaint:true,
                        backgroundColor:"#05091c",
                        logging:false,
                        imageTimeout:15000
                    }
                );


            const link =
                document.createElement("a");


            let filename =
                nameInput
                    .value
                    .trim()
                    .replace(
                        /[^a-z0-9_-]/gi,
                        "-"
                    );


            if(!filename){

                filename =
                    dlicomId;

            }


            link.download =
                "DliCOM-ID-" +
                filename +
                ".png";


            link.href =
                canvas.toDataURL(
                    "image/png"
                );


            link.click();

        }
        catch(error){

            console.error(error);

            alert(
                "PNG তৈরি করা যায়নি। আবার চেষ্টা করো।"
            );

        }


        downloadBtn.textContent =
            "Download PNG";

        downloadBtn.disabled =
            false;

    }
);

</script>
