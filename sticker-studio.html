<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DliCOM Sticker Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#17337d 0,#070d27 42%,#02040d 100%);color:#fff;font-family:Inter,Arial,sans-serif;padding:16px}.app{max-width:1180px;margin:auto}.top{text-align:center;margin:8px 0 18px}.top h1{margin:0;font-size:clamp(28px,6vw,48px);font-weight:900}.top p{margin:7px 0;color:#9eb0df;font-weight:700}.layout{display:grid;grid-template-columns:330px 1fr;gap:16px}.panel,.stage{border:1px solid #29427d;background:rgba(5,12,35,.94);border-radius:22px;box-shadow:0 18px 60px #0008}.panel{padding:14px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}.tab{border:1px solid #29427d;background:#09122f;color:#9eb0df;border-radius:10px;padding:10px 5px;font-size:11px;font-weight:900;cursor:pointer}.tab.active{background:#2f6bff;color:#fff;border-color:#5e8dff}.asset-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;max-height:570px;overflow:auto}.asset{position:relative;aspect-ratio:1;border:1px solid #263b70;border-radius:14px;background:#070d24;overflow:hidden;cursor:pointer}.asset:hover{border-color:#5e8dff;transform:translateY(-1px)}.asset img{width:100%;height:100%;object-fit:contain}.asset span{position:absolute;left:5px;right:5px;bottom:5px;padding:4px 5px;border-radius:7px;background:#020617c9;text-align:center;font-size:9px;font-weight:900}.empty{padding:25px 10px;text-align:center;color:#8194c1;font-size:12px;line-height:1.5}.upload{display:block;margin-top:12px;border:1px dashed #527dff;border-radius:12px;padding:12px;text-align:center;color:#b9c8ef;font-size:12px;font-weight:800;cursor:pointer}.upload input{display:none}.stage{padding:14px;display:flex;flex-direction:column;gap:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #30477f;background:#0a1538;color:#fff;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer}.btn.primary{background:linear-gradient(135deg,#2f6bff,#5b35ff);border:0}.btn.danger{color:#ffb6b6}.canvas-wrap{min-height:560px;display:grid;place-items:center;padding:15px;border-radius:18px;background:repeating-conic-gradient(#fff 0 25%,#e8e8e8 0 50%) 50%/24px 24px}.canvas{position:relative;width:min(720px,100%);aspect-ratio:1;background:transparent;overflow:hidden}.layer{position:absolute;left:50%;top:50%;width:34%;transform:translate(-50%,-50%);touch-action:none;cursor:grab;user-select:none}.layer img{width:100%;display:block;pointer-events:none}.layer.selected{outline:2px solid #5e8dff;outline-offset:5px}.hint{color:#8296c4;font-size:11px;font-weight:700}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls button{width:100%}@media(max-width:800px){.layout{grid-template-columns:1fr}.asset-grid{max-height:310px}.canvas-wrap{min-height:400px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><h1>DliCOM Sticker Studio</h1><p>Create, customize and export transparent DliCOM stickers.</p></header>
<div class="layout">
<aside class="panel">
<div class="tabs"><button class="tab active" data-cat="mascot">Mascots</button><button class="tab" data-cat="text">Text</button><button class="tab" data-cat="gear">Gear</button><button class="tab" data-cat="logo">Logo</button></div>
<div id="assets" class="asset-grid"></div>
<label class="upload">+ Upload PNG/JPG assets<input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple></label>
</aside>
<main class="stage">
<div class="toolbar"><button class="btn primary" id="addText">Add text</button><button class="btn" id="front">Bring front</button><button class="btn" id="back">Send back</button><button class="btn danger" id="remove">Delete</button><button class="btn primary" id="export">Download transparent PNG</button></div>
<div class="canvas-wrap"><div id="canvas" class="canvas"></div></div>
<div class="controls"><button class="btn" id="smaller">− Resize</button><button class="btn" id="larger">+ Resize</button></div>
<div class="hint">Tap an asset to add it. Drag the selected sticker to move it. Use Resize, layer controls and Delete. The exported PNG keeps the transparent background.</div>
</main>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script>
const C={mascot:[],text:[],gear:[],logo:[]};
let active='mascot',selected=null,z=1;
const assets=document.getElementById('assets'),canvas=document.getElementById('canvas');
function render(){assets.innerHTML='';const list=C[active];if(!list.length){assets.innerHTML='<div class="empty">No built-in '+active+' assets yet.<br>Use the upload button below to add your DliCOM transparent PNGs.</div>';return}list.forEach(a=>{const b=document.createElement('button');b.className='asset';b.innerHTML='<img src="'+a.src+'" alt=""><span>'+a.name+'</span>';b.onclick=()=>add(a.src,a.name);assets.appendChild(b)})}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));t.classList.add('active');active=t.dataset.cat;render()});
function add(src,name){const el=document.createElement('div');el.className='layer';el.style.zIndex=++z;el.innerHTML='<img src="'+src+'" alt="'+name+'">';el.dataset.scale='1';el.onclick=e=>{e.stopPropagation();select(el)};makeDrag(el);canvas.appendChild(el);select(el)}
function select(el){if(selected)selected.classList.remove('selected');selected=el;if(el)el.classList.add('selected')}
canvas.onclick=()=>select(null);
function makeDrag(el){let sx=0,sy=0,ox=0,oy=0,drag=false;const start=e=>{e.preventDefault();drag=true;select(el);const p=e.touches?e.touches[0]:e;sx=p.clientX;sy=p.clientY;const r=el.getBoundingClientRect(),c=canvas.getBoundingClientRect();ox=r.left+r.width/2-c.left;oy=r.top+r.height/2-c.top;el.style.cursor='grabbing'};const move=e=>{if(!drag)return;const p=e.touches?e.touches[0]:e;const c=canvas.getBoundingClientRect();el.style.left=((ox+p.clientX-sx)/c.width*100)+'%';el.style.top=((oy+p.clientY-sy)/c.height*100)+'%'};const end=()=>{drag=false;el.style.cursor='grab'};el.addEventListener('pointerdown',start);el.addEventListener('pointermove',move);el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end)}
function resize(n){if(!selected)return;let s=parseFloat(selected.dataset.scale||1)*n;s=Math.max(.25,Math.min(3,s));selected.dataset.scale=s;selected.style.width=(34*s)+'%'}
document.getElementById('smaller').onclick=()=>resize(.85);document.getElementById('larger').onclick=()=>resize(1.18);
document.getElementById('remove').onclick=()=>{if(selected){selected.remove();selected=null}};
document.getElementById('front').onclick=()=>{if(selected)selected.style.zIndex=++z};document.getElementById('back').onclick=()=>{if(selected)selected.style.zIndex=1};
document.getElementById('addText').onclick=()=>{const text=prompt('Sticker text','GM DliCOM!');if(!text)return;const el=document.createElement('div');el.className='layer';el.style.width='auto';el.style.minWidth='22%';el.style.padding='10px 18px';el.style.color='#fff';el.style.fontWeight='900';el.style.fontSize='clamp(18px,4vw,42px)';el.style.textAlign='center';el.style.textShadow='0 3px 0 #1450c7,0 0 10px #000';el.style.zIndex=++z;el.textContent=text;el.onclick=e=>{e.stopPropagation();select(el)};makeDrag(el);canvas.appendChild(el);select(el)};
document.getElementById('files').onchange=e=>[...e.target.files].forEach(f=>{const src=URL.createObjectURL(f);const cat=/text|gm|gn|lfg|wagmi|hodl|dyor|build/i.test(f.name)?'text':/cap|head|goggle|cape|watch|bag|flag|megaphone|laptop|cup|binocular|drone|gear/i.test(f.name)?'gear':/logo/i.test(f.name)?'logo':'mascot';C[cat].push({src,name:f.name});render()});
document.getElementById('export').onclick=async()=>{if(!canvas.children.length){alert('Add a sticker first.');return}if(selected)selected.classList.remove('selected');const out=await html2canvas(canvas,{backgroundColor:null,scale:3,useCORS:true});const a=document.createElement('a');a.download='dlicom-sticker.png';a.href=out.toDataURL('image/png');a.click();if(selected)selected.classList.add('selected')};
render();
</script>
</body>
</html>
